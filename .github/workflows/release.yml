name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Actions-provided, contents:write
      NEXT_TELEMETRY_DISABLED: '1'
      # Code signing — with one of these set up, Windows no longer warns about an unknown publisher
      # (SIGNING.md). With none, releases are built exactly as before, unsigned.
      #  - AZURE_CLIENT_ID (+ secrets AZURE_TENANT_ID, AZURE_CLIENT_SECRET and repository variables
      #    AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE, AZURE_PUBLISHER_NAME):
      #    Azure Trusted Signing; electron-builder signs every file while it builds.
      #  - WIN_CSC_LINK (base64 .pfx) + WIN_CSC_KEY_PASSWORD: a code-signing certificate;
      #    electron-builder signs every file while it builds.
      #  - SIGNPATH_API_TOKEN (+ repository variables SIGNPATH_ORGANIZATION_ID,
      #    SIGNPATH_PUBLISHER_NAME, and optionally SIGNPATH_PROJECT_SLUG /
      #    SIGNPATH_SIGNING_POLICY_SLUG): SignPath signs the finished installers, then the update
      #    feed is rebuilt for the signed files.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24' # the Node bundled in Electron 41 (the installed app's server runs on it)
      - run: npm ci --legacy-peer-deps
      # Next.js build cache: faster builds, and no "No build cache found" notice.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # One draft release up front. The nsis and portable targets publish concurrently; left to
      # electron-builder, each could create its own release (v1.3.1 got two, and "latest" pointed
      # at the one holding only the blockmap). Both now upload into this draft.
      - name: Create the draft release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft \
            --title "Ironbooks ${GITHUB_REF_NAME#v}" \
            --notes "Windows: download **Ironbooks-Setup-${GITHUB_REF_NAME#v}.exe** (installer) or **Ironbooks-${GITHUB_REF_NAME#v}.exe** (portable). Installed copies update themselves from here.

          [Code signing policy](https://github.com/${GITHUB_REPOSITORY}#-code-signing-policy) · [Privacy](https://github.com/${GITHUB_REPOSITORY}/blob/main/PRIVACY.md)"

      # --- Azure Trusted Signing, a certificate, or no signing: electron-builder builds, signs and
      # publishes in one go ---
      - name: Build & publish NSIS installer + portable + latest.yml (electron-updater)
        if: env.SIGNPATH_API_TOKEN == ''
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            npm run desktop:publish
            exit
          fi
          # Azure Trusted Signing. A half-configured setup fails here rather than shipping unsigned.
          for v in AZURE_TENANT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERT_PROFILE AZURE_PUBLISHER_NAME; do
            [ -n "${!v}" ] || { echo "::error::Azure Trusted Signing: $v is not set (see SIGNING.md)"; exit 1; }
          done
          npm run build
          # publisherName is also written into the app's update settings: installed copies then
          # accept only updates signed by this publisher.
          npx electron-builder --publish always \
            -c.win.azureSignOptions.endpoint="$AZURE_SIGNING_ENDPOINT" \
            -c.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGNING_ACCOUNT" \
            -c.win.azureSignOptions.certificateProfileName="$AZURE_CERT_PROFILE" \
            -c.win.azureSignOptions.publisherName="$AZURE_PUBLISHER_NAME"

      # --- SignPath: build, sign the installers, rebuild the update feed, publish ---
      - name: Build the installers for signing
        if: env.SIGNPATH_API_TOKEN != ''
        shell: bash
        env:
          SIGNPATH_PUBLISHER_NAME: ${{ vars.SIGNPATH_PUBLISHER_NAME }}
        run: |
          # The files are signed after the build, so electron-builder never sees the certificate and
          # cannot read the publisher from it. Without the name in the app's update settings,
          # installed copies would go on accepting unsigned updates. Stop rather than ship that.
          [ -n "$SIGNPATH_PUBLISHER_NAME" ] || { echo "::error::SignPath: SIGNPATH_PUBLISHER_NAME is not set (see SIGNING.md)"; exit 1; }
          npm run build
          # publisherName is written into the app's update settings: installed copies then accept
          # only updates signed by this publisher.
          npx electron-builder --win nsis portable --publish never \
            -c.win.signtoolOptions.publisherName="$SIGNPATH_PUBLISHER_NAME"
      - name: Hand the installers to SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-installers
          path: |
            release/Ironbooks-Setup-*.exe
            release/Ironbooks-[0-9]*.exe
          if-no-files-found: error
      - name: Sign with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Ironbooks' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release/signed
      - name: Publish the signed installers with an update feed that matches them
        if: env.SIGNPATH_API_TOKEN != ''
        shell: bash
        run: |
          cp -f release/signed/*.exe release/
          # Signing changed the installer's bytes: rebuild latest.yml (sha512, size) and the
          # block map, or installed copies would refuse the update.
          node scripts/refresh-update-info.mjs release
          V="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "release/Ironbooks-Setup-$V.exe" "release/Ironbooks-Setup-$V.exe.blockmap" \
            "release/Ironbooks-$V.exe" release/latest.yml --clobber

      # Publish only once every file is attached, so nobody sees a release without its installer.
      - name: Publish the release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > assets.txt
          cat assets.txt
          for f in "Ironbooks-Setup-${GITHUB_REF_NAME#v}.exe" "Ironbooks-Setup-${GITHUB_REF_NAME#v}.exe.blockmap" "Ironbooks-${GITHUB_REF_NAME#v}.exe" latest.yml; do
            grep -qx "$f" assets.txt || { echo "::error::missing $f on the release"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
